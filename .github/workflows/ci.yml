name: FinPay360 Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pgadmin
          POSTGRES_PASSWORD: root
          POSTGRES_DB: finpay360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Build Shared Contracts
        run: npm run build --workspace=packages/shared-types

      - name: Run Backend Unit & Financial Integrity Tests
        run: npm run test --workspace=apps/api
        env:
          DATABASE_URL: postgresql://pgadmin:root@localhost:5432/finpay360?schema=public

      - name: Build NestJS API Application
        run: npm run build --workspace=apps/api

      - name: Build Angular 20+ Production Bundle
        run: npm run build --workspace=apps/web

      - name: Build Docker Container Images
        run: |
          docker build -t finpay360-api:latest -f infrastructure/docker/Dockerfile.api .
          docker build -t finpay360-web:latest -f infrastructure/docker/Dockerfile.web .
