version: '3.8'

services:
  # 1. PostgreSQL ACID Core Database
  postgres:
    image: postgres:16-alpine
    container_name: finpay360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: finpay360
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgadmin -d finpay360"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Distributed Caching & Locks
  redis:
    image: redis:7-alpine
    container_name: finpay360-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Apache Kafka Event Broker (KRaft Mode)
  kafka:
    image: bitnami/kafka:3.7
    container_name: finpay360-kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - kafka_data:/bitnami/kafka

  # 4. FinPay360 NestJS API Gateway
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: finpay360-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://pgadmin:root@postgres:5432/finpay360?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=production-grade-super-secret-key-32-chars-minimum-length
    ports:
      - '3000:3000'

  # 5. FinPay360 Angular 20+ Frontend SPA
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: finpay360-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'

volumes:
  postgres_data:
  redis_data:
  kafka_data:
